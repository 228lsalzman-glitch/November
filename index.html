<!DOCTYPE html>
<html>
<head>
<title>November</title>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Agrave+Pro:wght@100..700&family=Rubik+Glitch&display=swap" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <div class="dave">
      <h1 style="font-family:'Courier New', Courier, monospace; color: goldenrod; text-align: center;">Random Thanksgiving Food Generator</h1>
      <img id="picture" src="img/pi.webp" width="400">

<button onclick="randomizeImage()">Randomize</button>

<script>
    let images = [
        "img/pi.webp",
        "img/ham.webp",
        "img/mac.webp",
        "img/potato.webp",
        "img/turk.webp",
        "img/bean.webp",
        "img/beef.webp",
        "img/biscuit.webp",
        "img/cornbread.webp",
        "img/pumpkin.webp",
        "img/sauce.webp",
        "img/stuffing.webp",
        "img/sweet.webp",
    ];

    function randomizeImage() {
        let randomIndex = Math.floor(Math.random() * images.length);
        document.getElementById("picture").src = images[randomIndex];
    }
</script>
    </div>


  </body>
</html>
